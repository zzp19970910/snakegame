# ============================================================
# 🌐 Nginx 配置文件
# 作用：Nginx 在这里干两件事：
#       1. 托管前端静态文件（HTML/CSS/JS）
#       2. 反向代理：把 /api/xxx 的请求转发给后端Node.js
# ============================================================

# Nginx worker 进程数（auto=自动匹配CPU核心数）
worker_processes auto;

# 连接事件配置
events {
    worker_connections 1024;    # 每个进程最多同时处理1024个连接
}

# HTTP 服务主配置
http {
    include       mime.types;           # 引入文件类型对照表
    default_type  application/octet-stream;  # 默认文件类型（二进制流）
    sendfile on;                        # 开启高效文件传输
    keepalive_timeout 65;               # 长连接保持65秒
    gzip on;                            # 开启Gzip压缩，减少传输体积
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 一个网站（虚拟主机）的配置 ----------
    server {
        listen 80;                      # 监听80端口（HTTP默认端口）
        server_name _;                  # 匹配任何域名（_ 是通配符）

        root /usr/share/nginx/html;     # 网站文件根目录（Dockerfile里把frontend文件拷到这里）
        index index.html;               # 默认首页文件名

        client_max_body_size 1M;        # 限制请求体最大1MB（防止恶意大文件上传）

        # -------- 规则1：所有 /api/ 开头的请求，转发给后端 --------
        location /api/ {
            # 关键！把请求转发到 backend 容器的 3000 端口
            # 这里的 backend 就是 docker-compose.yml 里的服务名！
            # Docker内部DNS会自动解析backend对应的IP地址
            proxy_pass http://backend:3000/api/;

            proxy_http_version 1.1;
            # 下面几行是把用户真实信息传给后端
            proxy_set_header Host $host;                    # 用户访问的域名
            proxy_set_header X-Real-IP $remote_addr;        # 用户真实IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 经过的代理链
            proxy_set_header X-Forwarded-Proto $scheme;     # HTTP还是HTTPS
            proxy_read_timeout 30s;                         # 后端超时30秒
            proxy_connect_timeout 10s;                      # 连接后端超时10秒
        }

        # -------- 规则2：其他所有请求，返回前端页面 --------
        location / {
            # try_files：先找真实文件，找不到就返回index.html
            # 这样前端路由刷新页面不会404
            try_files $uri $uri/ /index.html;
        }

        # -------- 规则3：静态资源（CSS/JS/图片）缓存7天 --------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;                                      # 浏览器缓存7天
            add_header Cache-Control "public, no-transform"; # 允许CDN/代理缓存
        }
    }
}