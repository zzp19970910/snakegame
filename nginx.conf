# ============================================================
# 🌐 Nginx 反向代理配置「终极不崩溃版」
#
# 🔑 核心改进：彻底解决 [emerg] host not found in upstream 崩溃
#   1. 用 resolver + set $变量方式 = Nginx 运行时解析 DNS，不是启动时
#      → 就算上游 DNS 暂时不通，Nginx 也能先启动成功
#   2. 不再依赖 Render 内部服务名 "backend"，直接用公网地址
#   3. 用 envsubst 支持 BACKEND_URL 环境变量替换（启动时注入）
# ============================================================

# 让 envsubst 识别的环境变量列表（只替换这两个，防止 Nginx 其他 $ 变量被误伤）
env BACKEND_URL;

worker_processes  auto;
events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # GZIP 压缩，手机访问更省流量
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name  _;
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # 【终极方案】resolver 指定 DNS 服务器
        # - 127.0.0.11 = Docker 内置 DNS 解析器（容器里默认有）
        # - valid=10s 每10秒重新解析（不要缓存太久）
        # - ipv6=off 强制 IPv4，避免一些云环境的 v6 坑
        resolver 127.0.0.11 valid=10s ipv6=off;

        # ---------- 规则1： /api/* 的请求 → 转发给后端 Node.js ----------
        location /api/ {
            # ✅ 用 set 定义变量 = Nginx 会在每次请求时用 resolver 动态解析
            #    而不是启动时一次性解析 → 就算 DNS 暂时没好也不 panic
            set $backend_upstream $BACKEND_URL;

            # 把 /api/xxx 完整路径转过去
            proxy_pass $backend_upstream;

            # HTTP 头转发（让后端拿到真实IP、真实Host）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时时间（首次唤醒 Render backend 可能要等 50 秒+）
            proxy_connect_timeout 120s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
            send_timeout          120s;
        }

        # ---------- 规则2： 其他所有请求 → 返回前端静态文件 ----------
        location / {
            try_files $uri $uri/ /index.html;
            # 静态资源强缓存，加速二次访问（JS/CSS/图片）
            if ($uri ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$) {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # 错误页面统一返回 index.html（前端 SPA 路由兜底）
        error_page  404              /index.html;
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}