# ============================================================
# 🐳 Render Blueprint 配置文件 (render.yaml) 最终版！
#
# ✅ 成功关键：
#   1. backend 服务先正常启动（已经验证过 ✅ Deployed）
#   2. 进 backend 服务页面，复制它的公网地址（格式：https://backend-xxxx.onrender.com）
#   3. 进 frontend 服务 → Environment → 找 BACKEND_URL，把值改成你上面复制的地址
#      (⚠️ 末尾不要 /，不要加 /api！就写 https://backend-xxxx.onrender.com 就行)
#   4. Save Changes → frontend 会自动重启，全部搞定！
# ============================================================

services:
  # ---------- 服务1：前端网站（Nginx + 反向代理到 backend 公网地址） ----------
  - type: web
    name: frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    healthCheckPath: /
    envVars:
      # ⚠️⚠️⚠️ Blueprint 创建完服务后，一定要手动改这个值！
      # 操作：Render Dashboard → 点 frontend → Environment → 找到下面这个 BACKEND_URL → Edit
      # 改成：https://你的backend服务的公网地址.onrender.com
      # 例：https://backend-a1b2c3.onrender.com   （末尾不要加 /，不要加 /api）
      - key: BACKEND_URL
        value: "http://placeholder.invalid"

  # ---------- 服务2：后端API（Node.js + Express + SQLite） ----------
  - type: web
    name: backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health