# ============================================================
# 🐳 Render Blueprint 配置文件 (render.yaml) 终极修正版！
#
# 🔧 解决：之前失败的核心原因
#   - 两个 Dockerfile 原来都叫 Dockerfile，放在不同目录
#   - dockerfilePath + dockerContext 组合混乱，COPY 找不到文件
#
# ✅ 现在的方案（清晰不冲突）：
#   - 仓库根目录放 两个 明确命名的 Dockerfile
#       Dockerfile.frontend  (给 Nginx 前端)
#       Dockerfile.backend   (给 Node 后端)
#   - 两个服务的 dockerContext 统一 = 仓库根目录 "."
#   - 每个服务指定各自的 dockerfilePath
# ============================================================

services:
  # ---------- 服务1：前端网站（Nginx + 静态文件 + 等待脚本） ----------
  - type: web
    name: frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .              # ✅ 统一从仓库根目录构建
    healthCheckPath: /
    # 启动顺序：显式声明依赖 backend（先起 backend，再起 frontend）
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: backend
          property: host
      - key: BACKEND_PORT
        fromService:
          type: web
          name: backend
          property: port

  # ---------- 服务2：后端API（Node.js + Express + SQLite） ----------
  # ⚠️ 服务名必须叫 "backend"！nginx.conf 写的 proxy_pass http://backend:3000
  - type: web
    name: backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .              # ✅ 统一从仓库根目录构建，COPY backend/xxx 不会错
    healthCheckPath: /api/health
    # 免费套餐没有 Disk，实例重启排行榜会清空