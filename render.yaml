# ============================================================
# 🐳 Render Blueprint 配置文件 (render.yaml)
# 解决 Blueprint 部署失败的终极版：
#   - frontend Dockerfile 已加等待脚本，等 backend 就绪才启动 Nginx
#   - 服务名严格叫 backend，与 nginx.conf proxy_pass http://backend:3000 对应
# ============================================================

services:
  # ---------- 服务1：前端网站（Nginx + 静态文件 + 等待脚本） ----------
  - type: web
    name: frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    # 构建上下文=仓库根目录（会复制 ./frontend、nginx.conf、等待脚本）
    dockerContext: .
    healthCheckPath: /
    # 显式声明依赖（Render会先启动backend，frontend要后启动）
    # 但即使有这个，DNS解析仍然有延迟，所以Dockerfile里加了等待脚本双保险
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: backend
          property: host
      - key: BACKEND_PORT
        fromService:
          type: web
          name: backend
          property: port

  # ---------- 服务2：后端API（Node.js + Express + SQLite） ----------
  # ⚠️ 服务名必须叫 "backend"！与 nginx.conf 的 upstream 完全一致
  - type: web
    name: backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    # 构建上下文=backend子目录（这里面的 package.json / server.js 才是后端的）
    dockerContext: ./backend
    healthCheckPath: /api/health
    # 免费套餐没有 Disk，实例重启排行榜会清空（已知限制）