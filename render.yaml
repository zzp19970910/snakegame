# ============================================================
# 🐳 Render Blueprint 配置文件 (render.yaml)
# 作用：告诉 Render 怎么部署我们的两个服务（frontend + backend）
# 等价于我们本地的 docker-compose.yml，只是 Render 有自己的格式
# ============================================================

services:
  # ---------- 服务1：前端网站（Nginx + 静态文件） ----------
  - type: web
    name: snake-frontend
    runtime: docker
    region: singapore           # 新加坡节点，延迟最低
    plan: free                  # 免费套餐
    dockerfilePath: ./Dockerfile
    dockerContext: .            # 构建上下文 = 仓库根目录
    healthCheckPath: /
    # 同一 Blueprint 内的服务可以直接用服务名互相访问
    # Nginx 里写的 proxy_pass http://backend:3000 正好能用！

  # ---------- 服务2：后端API（Node.js + Express + SQLite） ----------
  - type: web
    name: snake-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend    # 构建上下文 = backend 子目录
    healthCheckPath: /api/health
    # 数据库数据卷挂载（防止休眠重启后排行榜清空）
    # 注意：free 套餐的 disk 也是免费的！有 1GB
    disk:
      name: snake-db-data
      mountPath: /app/data
      sizeGB: 1